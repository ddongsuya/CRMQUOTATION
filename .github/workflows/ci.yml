name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · test · migrate · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬(Windows)과 동일한 Node 24 — 테스트가 .ts 모듈을 직접 require 하며 Node 22.18+/24 의 타입 스트리핑에 의존
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=50

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (engine · lib)
        run: npm test

      - name: Regression (rules catalog · assemble · suggest)
        run: npm run test:regression

      - name: Apply migrations to empty Postgres
        run: npx prisma migrate deploy

      - name: Migration drift check (migrations ↔ schema.prisma)
        # db push 로 몰래 바꾼 스키마 변경이 있으면 여기서 실패한다.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Build
        run: npm run build
